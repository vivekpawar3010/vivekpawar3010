<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080D"/>
      <stop offset="50%" stop-color="#0B121C"/>
      <stop offset="100%" stop-color="#05080D"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#C8FF45"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <!-- V Gradient -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C8FF45"/>
    </linearGradient>

    <!-- P Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Orbiting Cybernetic Ring -->
  <g filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="178" ry="132" fill="none" stroke="#C8FF45" stroke-width="4" stroke-dasharray="14 12" opacity="0.45" transform="rotate(-18 256 256)" />
    <ellipse cx="256" cy="256" rx="184" ry="138" fill="none" stroke="#FF6B00" stroke-width="3" opacity="0.4" transform="rotate(22 256 256)" />
    <!-- Orbiting Energy Dots -->
    <circle cx="112" cy="180" r="7" fill="#C8FF45" />
    <circle cx="400" cy="332" r="7" fill="#FF6B00" />
  </g>

  <!-- Architectural VP Monogram -->
  <g filter="url(#glow)">
    <!-- V Shape -->
    <path d="M142 165 L246 360 L298 256" fill="none" stroke="url(#vGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- P Shape -->
    <path d="M284 148 V364 M284 148 H346 C376 148 396 170 396 202 C396 234 376 256 346 256 H284" fill="none" stroke="url(#pGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Vertex Core Light -->
    <circle cx="246" cy="360" r="8" fill="#C8FF45" />
    <circle cx="284" cy="148" r="7" fill="#FF6B00" />
  </g>
</svg>
